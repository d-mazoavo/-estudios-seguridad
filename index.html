<div id="lock"></div>

  <aside class="side">
    <div class="brand"><div class="brand-name">Avo Pak</div><div class="brand-sub">Dirección de Seguridad Integral<br>Estudios de seguridad de personal</div></div>
    <nav id="nav" aria-label="Secciones">
      <a href="#/tablero" data-route="tablero">Tablero</a>
      <a href="#/personas" data-route="personas">Personas</a>
      <a href="#/vencimientos" data-route="vencimientos">Vencimientos <span class="navcount" id="navvenc" hidden></span></a>

      <div class="top-actions"><div class="operator" id="operator"></div><button class="btn" data-act="lock" type="button">Bloquear</button></div>

    <main id="main" tabindex="-1"></main>
  </div>

<div id="toast" role="status" aria-live="polite"></div>
